[project]
name = "noise-algorithms"
version = "1.0.0"
description = "A collection of noise generation algorithms (Perlin, ...) in pure Python"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Quentin Pigné" }]
keywords = [
    "noise",
    "perlin",
    "perlin-noise",
    "procedural",
    "procedural-generation",
    "noise-generator",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/quentinpigne/noise-algorithms/tree/main/packages/python#readme"
Repository = "https://github.com/quentinpigne/noise-algorithms"
Issues = "https://github.com/quentinpigne/noise-algorithms/issues"

[project.optional-dependencies]
images = ["numpy", "matplotlib"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pillow>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noise_algorithms"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that import the built wheel in an isolated environment",
]
